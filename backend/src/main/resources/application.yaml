server:
  port: 8000

spring:
  application:
    name: cloud

  datasource:
    url: jdbc:mysql://localhost:3306/cloud?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s
      connect-timeout: 3s
  mail:
    host: smtp.qq.com
    port: 587
    username: 3123616971@qq.com
    password: ntujbsbxhnbjdcga
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration

    # 执行迁移前验证已应用脚本
    validate-on-migrate: true

    # 严格验证迁移文件命名
    validate-migration-naming: true

    # 迁移目录丢失时启动失败
    fail-on-missing-locations: true

    # 禁止清空数据库
    clean-disabled: true

    # 禁止自动将已有数据库标记为基线
    baseline-on-migrate: false

    # 不允许乱序执行旧版本迁移
    out-of-order: false

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: id
cloud:
  cors:
    # 多个前端来源用逗号分隔，例如 https://cloud.example.com,https://admin.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  verification:
    hmac-secret: L5tizeYFAlrP5x5+IBtmKEMizI4D1Np7aAVOB+Hsa10=
    email:
      from: 3123616971@qq.com
    code-ttl-seconds: 300
    send-interval-seconds: 60
    max-failures: 5
    ip-hourly-limit: 20
    target-daily-limit: 10
    global-hourly-limit: 1000
  auth:
    jwt:
      # Base64编码的随机密钥，解码后至少32字节；部署时通过JWT_SECRET配置独立密钥。
      secret: ${JWT_SECRET:${cloud.verification.hmac-secret}}
      issuer: cloudlane
      access-token-ttl-seconds: 900
    default-space-name: '默认空间'
    default-space-icon: ''
    default-space-color: '#fff'
    default-space-description: '默认空间'
