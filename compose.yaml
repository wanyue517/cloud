services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cloud}
      MYSQL_USER: ${DB_USERNAME:-cloud}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    profiles: ["app"]
    build:
      context: ./backend
      args:
        MODULE: cloud-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-cloud}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${DB_USERNAME:-cloud}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      VERIFICATION_HMAC_SECRET: ${VERIFICATION_HMAC_SECRET:?Set VERIFICATION_HMAC_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,capacitor://localhost,https://localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      CLOUD_STORAGE_ROOT: /app/data/objects
      CLOUD_UPLOAD_TEMP: /app/data/uploads
      CLOUD_PREVIEW_ROOT: /app/data/previews
      CLOUD_WORKER_TMP: /app/data/worker-tmp
      CLOUD_PREVIEW_GOTENBERG_URL: ${CLOUD_PREVIEW_GOTENBERG_URL:-http://gotenberg:3000}
      CLOUD_SEARCH_MEILI_URL: ${CLOUD_SEARCH_MEILI_URL:-http://meilisearch:7700}
      CLOUD_SEARCH_MEILI_KEY: ${MEILI_MASTER_KEY:-cloudlane-dev-master-key}
      CLOUD_SEARCH_TIKA_URL: ${CLOUD_SEARCH_TIKA_URL:-http://tika:9998}
    volumes: ["drive-data:/app/data"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
  worker:
    profiles: ["app"]
    build:
      context: ./backend
      args:
        MODULE: cloud-worker
    environment:
      CLOUD_WORKER_ENABLED: ${CLOUD_WORKER_ENABLED:-true}
      CLOUD_WORKER_NODE_ID: ${CLOUD_WORKER_NODE_ID:-worker-compose-1}
      CLOUD_STORAGE_ROOT: /app/data/objects
      CLOUD_PREVIEW_ROOT: /app/data/previews
      CLOUD_WORKER_TMP: /app/data/worker-tmp
    volumes: ["drive-data:/app/data"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  gotenberg:
    profiles: ["app", "office"]
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--libreoffice-restart-after=10"
      - "--libreoffice-max-queue-size=16"
    ports: ["127.0.0.1:${GOTENBERG_PORT:-3002}:3000"]
  meilisearch:
    profiles: ["app", "search"]
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cloudlane-dev-master-key}
    ports: ["127.0.0.1:${MEILI_PORT:-7700}:7700"]
    volumes: ["meili-data:/meili_data"]
  tika:
    profiles: ["app", "search"]
    image: apache/tika:2.9.2.1-full
    ports: ["127.0.0.1:${TIKA_PORT:-9998}:9998"]
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:80"]
volumes:
  mysql-data:
  redis-data:
  drive-data:
  meili-data:
