services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cloud
      MYSQL_USER: ${DB_USERNAME:-cloud}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  api:
    profiles: ["app"]
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cloud?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${DB_USERNAME:-cloud}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      VERIFICATION_HMAC_SECRET: ${VERIFICATION_HMAC_SECRET:?Set VERIFICATION_HMAC_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
    volumes: ["drive-data:/app/data"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
  web:
    profiles: ["app"]
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  mysql-data:
  redis-data:
  drive-data:
