function space(id){return data.spaces.find(s=>s.id===id)}
function visible(n){return n&&!n.deleted&&(data.settings.showHidden||!n.hidden)}
function children(parent,spaceId=state.space){return data.nodes.filter(n=>n.space===spaceId&&n.parent===parent&&visible(n))}
function subfolders(parent,spaceId=state.space){return children(parent,spaceId).filter(n=>n.kind==='folder').sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'))}
function currentFolder(){return node(state.folder)}
function pathTo(n){const a=[];let cur=n;let guard=0;while(cur&&guard++<100){a.unshift(cur);cur=node(cur.parent)}return a}
function getVisibleChildren(){let a=children(state.folder);if(state.category!=='all')a=a.filter(n=>n.category===state.category);if(state.sort==='name')a.sort((a,b)=>a.kind===b.kind?a.name.localeCompare(b.name,'zh-CN'):a.kind==='folder'?-1:1);if(state.sort==='size')a.sort((a,b)=>(b.size||0)-(a.size||0));if(state.sort==='time')a.sort((a,b)=>b.modified.localeCompare(a.modified));return a}
function navSpace(sid,folder=null,root=null){let sp=space(sid);if(sp?.kind==='private'&&!state.privateUnlocked){state.modal={type:'unlock',sid,folder,root};renderPopup();return} state.view='files';state.space=sid;state.folder=folder;state.sharedRoot=root;state.activeSide=root?'sharein':'space:'+sid;state.category='all';state.selected.clear();state.popover=null;if(folder){pathTo(node(folder)).forEach(n=>state.treeExpanded.add(n.id))}render()}
function gotoView(v){state.view=v;state.selected.clear();state.activeSide=v;state.popover=null;render()}
function navItem(icon,title,act,active,extra=''){return `<button class="nav-item ${active?'active':''}" data-act="${act}" title="${esc(title)}">${I(icon)}<span class="nav-main">${esc(title)}</span>${extra}</button>`}
function renderSidebar(){const spaces=data.spaces.filter(s=>s.kind!=='private');return `<aside class="sidebar"><div class="brand"><span class="brand-mark">${I('cloud','lg')}</span><div><b>Cloudlane</b><small>个人文件工作台</small></div></div><div class="sidebar-scroll"><div class="section-label">我的空间<button class="iconbtn" style="width:19px;height:18px" data-act="spaceCreate" title="新建空间">${I('plus','sm')}</button></div>${spaces.map(s=>`<button class="nav-item ${state.activeSide==='space:'+s.id?'active':''}" data-act="navSpace" data-id="${s.id}"><span class="space-dot ${s.color}"></span><span class="nav-main">${esc(s.name)}</span>${s.kind==='shared'?I('users','sm'):''}</button>`).join('')}<div class="section-label">常用工具</div>${navItem('home','快捷访问','navQuick',state.view==='quick')}${navItem('star','我的收藏','navFavorites',state.view==='favorites')}${navItem('clock','最近使用','navRecent',state.view==='recent')}<div class="section-label">协作与安全</div>${navItem('folder-input','共享中心','navShare',state.view==='share')}${navItem('lock','私密空间','navPrivate',state.activeSide==='space:s5')}${navItem('trash','回收站','navTrash',state.view==='trash')}<div class="section-label">偏好</div>${navItem('settings','设置','navSettings',state.view==='settings')}</div><div class="side-bottom"><div class="usage-row"><span>存储空间使用情况</span><span>3.4 GB / 10 GB</span></div><div class="meter"><i></i></div><div class="account" data-act="accountMenu"><div class="avatar">WY</div><div style="flex:1;min-width:0"><div class="name">演示管理员</div><div class="sub">超级管理员账号</div></div>${I('more')}</div></div></aside>`}
function treeRow(n,depth=0){const open=state.treeExpanded.has(n.id);const ch=subfolders(n.id,n.space);return `<div class="tree-node ${state.folder===n.id?'active':''}" style="padding-left:${Math.min(depth*17+7,160)}px" data-act="treeNav" data-id="${n.id}" draggable="true" data-dragid="${n.id}" title="${esc(n.name)}"><button class="twisty" data-act="treeToggle" data-id="${n.id}">${ch.length?I(open?'chevron-down':'chevron-right','sm'):''}</button>${I('folder','folder-icon')}<span class="tree-name">${esc(n.name)}</span>${n.shared?I('users','sm'):''}</div>${open?ch.map(x=>treeRow(x,depth+1)).join(''):''}`}
function contextPane(){const v=state.view;let head=v==='share'?'共享导航':v==='settings'?'设置导航':v==='search'?'搜索范围':v==='trash'?'回收站':v==='quick'?'快捷访问':v==='favorites'?'我的收藏':'最近使用';let body='';if(v==='share')body=`<div class="section-label">共享中心</div>${[['in','与我共享','folder-input'],['out','我发起的共享','send'],['links','分享链接','link']].map(([k,label,icon])=>`<button class="nav-item ${state.searchMode===k?'active':''}" data-act="shareTab" data-value="${k}">${I(icon,'sm')}<span class="nav-main">${label}</span></button>`).join('')}<div class="section-label">共享空间</div>${data.spaces.filter(x=>x.kind==='shared').map(x=>`<button class="nav-item" data-act="navSpace" data-id="${x.id}">${I('users','sm')}<span class="nav-main">${esc(x.name)}</span></button>`).join('')}`;else if(v==='settings')body=`<div class="section-label">偏好分类</div>${[['profile','个人资料','user'],['file','文件管理','folder'],['security','账户安全','shield'],['appearance','外观偏好','sun']].map(([k,label,icon])=>`<button class="nav-item ${state.settingTab===k?'active':''}" data-act="settingsTab" data-value="${k}">${I(icon,'sm')}<span class="nav-main">${label}</span></button>`).join('')}`;else if(v==='search')body=`<div class="section-label">检索类型</div>${[['all','全部结果'],['folder','文件夹'],['name','文件名称'],['content','正文内容']].map(([k,l])=>`<button class="nav-item ${state.searchMode===k?'active':''}" data-act="searchCategory" data-value="${k}">${I('search','sm')}<span class="nav-main">${l}</span></button>`).join('')}`;else if(v==='trash')body=`<div class="notice" style="margin:14px 8px">${I('info')}已删除的资源可在此恢复。正式版本将支持 30 天回收策略。</div>`;else body=`<div class="section-label">常用目录</div>${data.quick.map(node).filter(visible).map(n=>`<button class="nav-item" data-act="openNode" data-id="${n.id}">${I('folder','sm')}<span class="nav-main">${esc(n.name)}</span></button>`).join('')}`;return `<section class="tree-pane"><div class="tree-head"><div><div class="tree-heading">${I('list','sm')}${head}</div><div class="tree-sub">根据当前页面切换辅助导航</div></div></div><div class="tree-scroll" style="padding:8px">${body}</div><div class="tree-foot">导航与文件结构保持独立</div></section>`}
function tree(){if(state.view!=='files')return contextPane();let base=state.sharedRoot?node(state.sharedRoot):null;const list=base?[base]:subfolders(null,state.space);const sp=space(state.space);return `<section class="tree-pane"><div class="tree-head"><div><div class="tree-heading">${I('folder','sm')}${esc(base?base.name:(sp?.name||'目录结构'))}</div><div class="tree-sub">${base?'来自共享文件夹':'文件夹结构 · 可展开'}</div></div><button class="iconbtn" data-act="newFolder" title="新建文件夹">${I('plus')}</button></div><div class="tree-scroll">${base?treeRow(base):list.map(n=>treeRow(n)).join('')}${list.length?'':`<div class="empty" style="padding:26px 8px;font-size:11px">暂无文件夹</div>`}</div><div class="tree-foot"><span>${list.length} 个根级文件夹</span><button class="iconbtn" style="height:25px;width:25px" data-act="collapseAll" title="全部收起">${I('list','sm')}</button></div></section>`}
function bread(){if(state.view!=='files')return `<span class="crumb" style="color:#34445c">${({'share':'共享中心','quick':'快捷访问','favorites':'我的收藏','recent':'最近使用','trash':'回收站','settings':'个人设置','search':'全局搜索'})[state.view]||'文件工作台'}</span>`;const sp=space(state.space);let parts=state.folder?pathTo(node(state.folder)):[];if(state.sharedRoot){const i=parts.findIndex(n=>n.id===state.sharedRoot);parts=parts.slice(i>=0?i:0);return `<button class="crumb" data-act="navShare">共享中心</button>${I('chevron-right','sm')}${parts.map((n,i)=>`<button class="crumb" data-act="navigateFolder" data-id="${n.id}">${esc(n.name)}</button>${i<parts.length-1?I('chevron-right','sm'):''}`).join('')}`};return `<button class="crumb" data-act="navSpace" data-id="${sp.id}">${esc(sp.name)}</button>${parts.length?I('chevron-right','sm'):''}${parts.map((n,i)=>`<button class="crumb" data-act="navigateFolder" data-id="${n.id}">${esc(n.name)}</button>${i<parts.length-1?I('chevron-right','sm'):''}`).join('')}`}
function renderTopbar(){return `<header class="topbar"><div class="breadcrumbs">${bread()}</div><div class="top-actions"><button class="search-trigger" data-act="openSearch" title="全局搜索（Ctrl+K）">${I('search','sm')}<span>搜索所有文件...</span><span class="kbd">Ctrl K</span></button><button class="iconbtn" data-act="toggleNotice" title="消息通知">${I('bell')}${data.messages.some(m=>!m.read)?'<span class="status-dot" style="position:absolute;transform:translate(9px,-9px)"></span>':''}</button><button class="btn primary" data-act="upload" title="演示上传仅创建本地模拟文件条目">${I('upload','sm')}上传文件</button></div></header>`}
function pageHero(title,desc,actions=''){return `<div class="page-hero"><div><h1 class="page-title">${esc(title)}</h1><div class="page-desc">${esc(desc)}</div></div><div class="hero-actions">${actions}</div></div>`}
function fileIcon(n){return `<span class="file-symbol ${n.category}">${I(catIcons[n.category]||'file','lg')}</span>`}
function countTabs(){const arr=children(state.folder);const counts={all:arr.length};arr.forEach(n=>counts[n.category]=(counts[n.category]||0)+1);return `<div class="tabs">${Object.entries(counts).map(([k,v])=>`<button class="tab ${state.category===k?'active':''}" data-act="setCategory" data-value="${k}">${catLabels[k]||k}<small>${v}</small></button>`).join('')}</div>`}
function fileItem(n){let detail=n.kind==='folder'?'文件夹':`${(n.name.split('.').pop()||'').toUpperCase()} · ${fmtSize(n.size)}`;return `<tr class="${state.selected.has(n.id)?'selected':''}" data-rowid="${n.id}" draggable="true" data-dragid="${n.id}"><td class="checkcol"><input aria-label="选择资源" class="checkbox" type="checkbox" data-select="${n.id}" ${state.selected.has(n.id)?'checked':''}/></td><td><div class="file-name" data-act="openNode" data-id="${n.id}">${fileIcon(n)}<div style="min-width:0"><div class="fname">${esc(n.name)} ${n.shared?`<span class="pill-tag tag-blue">共享</span>`:''}${n.hidden?`<span class="pill-tag">隐藏</span>`:''}</div><div class="file-detail">${detail}</div></div></div></td><td class="datecol">${esc(n.modified)}</td><td class="sizecol">${n.kind==='folder'?'—':fmtSize(n.size)}</td><td class="actioncol"><div class="row-acts"><button class="mini-link" data-act="toggleFavorite" data-id="${n.id}" title="${n.favorite?'取消收藏':'收藏'}" style="${n.favorite?'color:#d29a46':''}">${I('star','sm')}</button><button class="mini-link" data-act="rowMenu" data-id="${n.id}" title="更多操作">${I('more')}</button></div></td></tr>`}
function fileCard(n){const bg=n.category==='image'?`<div style="width:100%;height:100%;background:${n.name.includes('秋')?'linear-gradient(135deg,#a3d6c1,#e6caaa 52%,#cf9b83)':'linear-gradient(145deg,#7aa4b7,#d6bf95 55%,#7ca2a5)'}"></div>`:I(catIcons[n.category]||'file');return `<div class="file-card ${state.selected.has(n.id)?'selected':''}" data-act="openNode" data-id="${n.id}" data-cardid="${n.id}" draggable="true" data-dragid="${n.id}"><div class="card-visual">${bg}</div><div class="card-info"><div class="row"><span class="card-title" style="flex:1">${esc(n.name)}</span><button class="mini-link" data-act="rowMenu" data-id="${n.id}">${I('more','sm')}</button></div><div class="card-meta">${n.kind==='folder'?'文件夹':fmtSize(n.size)} · ${n.modified}</div></div></div>`}
function batchBar(){if(!state.selected.size)return '';return `<div class="batchbar"><b>${state.selected.size} 项已选</b><button class="btn small" data-act="batchRename">批量重命名</button><button class="btn small" data-act="batchMove">移动</button><button class="btn small" data-act="batchDelete">删除</button><button class="iconbtn" style="color:white" data-act="clearSelection">${I('x')}</button></div>`}
function filesPage(){const sp=space(state.space);const c=currentFolder();const a=getVisibleChildren();const title=c?.name||sp?.name||'文件工作台';const desc=c?'文件夹内容 · 使用上方类型标签快速筛选':'在可展开的文件树中直接管理资源，不必一层层进入';const role=state.sharedRoot?'共享文件夹':sp?.kind==='shared'?'共享空间':sp?.kind==='private'?'私密空间':'个人空间';return `<div class="content-scroll" id="page-scroll">${pageHero(title,desc,`<button class="btn" data-act="newFolder">${I('folder','sm')}新建文件夹</button><button class="btn primary" data-act="upload">${I('upload','sm')}上传文件</button>`)}<div class="hero-subrow"><span class="pill-tag ${sp?.kind==='shared'?'tag-green':sp?.kind==='private'?'tag-purple':'tag-blue'}">${role}</span><span>当前目录 ${children(state.folder).length} 项</span>${sp?.kind==='shared'?`<button class="btn small ghost" data-act="members">${I('users','sm')}成员管理</button>`:''}${state.sharedRoot?`<span>来自团队授权目录</span>`:''}</div><div class="toolbar">${countTabs()}<div class="tools"><button class="iconbtn ${state.layout==='list'?'active':''}" data-act="setLayout" data-value="list" title="列表视图">${I('list')}</button><button class="iconbtn ${state.layout==='grid'?'active':''}" data-act="setLayout" data-value="grid" title="网格视图">${I('grid')}</button><select class="select-min" id="sort-select" aria-label="文件排序"><option value="name" ${state.sort==='name'?'selected':''}>名称排序</option><option value="time" ${state.sort==='time'?'selected':''}>修改时间</option><option value="size" ${state.sort==='size'?'selected':''}>文件大小</option></select><button class="iconbtn ${data.settings.showHidden?'active':''}" data-act="toggleHidden" title="显示/隐藏隐藏项">${I('filter')}</button></div></div><div class="section-inline">文件资源 <span>双击打开 / 右键更多操作 / 拖动到左侧目录移动</span></div>${!a.length?`<div class="empty">${I('folder')}<b>这里暂时没有${state.category==='all'?'文件':'该类型文件'}</b><p>试试切换文件类型，或点击「上传文件」创建一个演示文件条目。</p></div>`:state.layout==='list'?`<table class="file-table"><thead><tr><th class="checkcol"><input type="checkbox" class="checkbox" id="select-all" ${state.selected.size&&state.selected.size===a.length?'checked':''}/></th><th>名称</th><th class="datecol">修改时间</th><th class="sizecol">大小</th><th class="actioncol">操作</th></tr></thead><tbody>${a.map(fileItem).join('')}</tbody></table>`:`<div class="file-grid">${a.map(fileCard).join('')}</div>`}${batchBar()}</div>`}
function resourceCard(n,sub='',action='openNode'){return `<div class="resource-card" data-act="${action}" data-id="${n.id}"><div class="resource-top"><div class="row">${fileIcon(n)}<div><b>${esc(n.name)}</b><div class="small-label">${n.kind==='folder'?'文件夹':catLabels[n.category]}</div></div></div>${I('arrow-right','sm')}</div><p>${esc(sub||`来自 ${space(n.space)?.name||'未知空间'}`)}</p><div class="resource-foot"><span>${n.kind==='folder'?`${children(n.id,n.space).length} 项内容`:fmtSize(n.size)}</span><span>${esc(n.modified)}</span></div></div>`}
function collectionPage(kind){let title='',desc='',a=[];if(kind==='quick'){title='快捷访问';desc='把高频使用的文件夹固定在这里，包括别人共享给你的目录。';a=data.quick.map(node).filter(visible)}if(kind==='favorites'){title='我的收藏';desc='文件和文件夹都可收藏，但隐藏资源不在这里展示。';a=data.nodes.filter(n=>n.favorite&&visible(n))}if(kind==='recent'){title='最近使用';desc='最近打开过的文件资源，方便继续之前的工作。';a=data.nodes.filter(n=>n.lastOpened&&!n.deleted&&!n.hidden).sort((a,b)=>b.lastOpened-a.lastOpened).slice(0,20)}return `<div class="content-scroll">${pageHero(title,desc)}<div class="section-inline">${title} <span>共 ${a.length} 项</span></div>${a.length?`<div class="collection">${a.map(n=>resourceCard(n)).join('')}</div>`:`<div class="empty">${I('folder')}<b>当前没有资源</b><p>在文件或文件夹右键菜单中添加，之后就能在这里快速打开。</p></div>`}</div>`}
function sharePage(){const inbound=data.spaces.filter(s=>s.kind==='shared'&&!s.owner);const incomingNodes=data.nodes.filter(n=>n.shared&&!n.deleted&&!space(n.space)?.owner);const outward=data.nodes.filter(n=>n.shared&&!n.deleted&&space(n.space)?.owner);const active=state.searchMode==='all'?'in':state.searchMode;return `<div class="content-scroll">${pageHero('共享中心','统一查看与你有关的共享文件夹、成员邀请和分享链接。')}<div class="notice">${I('info')}<div><b>共享文件夹不复制原始资源。</b> 你可以从这里直接打开其他用户授权的目录，也可以把它固定在「快捷访问」。共享空间则直接显示在左侧空间列表。</div></div><div class="toolbar" style="margin-top:14px"><div class="tabs">${[['in','与我共享'],['out','我发起的共享'],['links','分享链接']].map(([k,label])=>`<button class="tab ${active===k?'active':''}" data-act="shareTab" data-value="${k}">${label}</button>`).join('')}</div><button class="btn small" data-act="members">${I('users','sm')}成员管理示例</button></div>${active==='in'?`<div class="section-inline">加入的共享空间与共享文件夹 <span>选择资源即可打开</span></div><div class="collection">${inbound.map(s=>`<div class="resource-card" data-act="navSpace" data-id="${s.id}"><div class="resource-top"><div class="row">${I('users','lg')}<b>${esc(s.name)}</b></div><span class="pill-tag tag-green">共享空间</span></div><p>来自：设计组 · 你的身份：${esc(s.role)}</p><div class="resource-foot"><span>加入的共享空间</span>${I('arrow-right')}</div></div>`).join('')}${incomingNodes.map(n=>resourceCard(n,`来自：${space(n.space)?.name} · 角色：编辑者`,'openSharedFolder')).join('')}</div>`:active==='out'?`<div class="section-inline">我发起的共享 <span>${outward.length} 个共享文件夹</span></div><div class="collection">${outward.map(n=>resourceCard(n,'已共享给：'+(n.shareTo||'协作成员'),'manageShared')).join('')}${data.spaces.filter(s=>s.kind==='shared'&&s.owner).map(s=>`<div class="resource-card" data-act="members"><div class="resource-top"><div class="row">${I('users','lg')}<b>${esc(s.name)}</b></div><span class="pill-tag tag-green">共享空间</span></div><p>管理成员和访问权限</p><div class="resource-foot"><span>所有者</span>${I('arrow-right')}</div></div>`).join('')}</div>`:`<div class="section-inline">分享链接 <button class="btn small" data-act="linkCreate">${I('plus','sm')}新建分享</button></div><div class="collection">${data.links.map(l=>`<div class="resource-card"><div class="resource-top"><div class="row">${I('link','lg')}<b>${esc(l.name)}</b></div><span class="pill-tag ${l.enabled?'tag-green':''}">${l.enabled?'有效':'已停用'}</span></div><p>访问密码：${esc(l.pass||'无')} · ${esc(l.expire)}<br/>访问次数：${l.visits}</p><div class="resource-foot"><button class="btn small" data-act="linkCopy" data-id="${l.id}">复制链接</button><button class="btn small" data-act="linkToggle" data-id="${l.id}">${l.enabled?'停用':'启用'}</button></div></div>`).join('')}</div>`}</div>`}
function trashPage(){const a=data.nodes.filter(n=>n.deleted);return `<div class="content-scroll">${pageHero('回收站','删除的文件会先保留，避免误操作造成数据丢失。')}<div class="section-inline">已删除资源 <span>${a.length} 项</span></div>${a.length?`<table class="file-table"><thead><tr><th>名称</th><th>来源空间</th><th>操作</th></tr></thead><tbody>${a.map(n=>`<tr><td>${esc(n.name)}</td><td>${esc(space(n.space)?.name)}</td><td><button class="btn small" data-act="restore" data-id="${n.id}">恢复</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${I('trash')}<b>回收站是空的</b><p>删除文件后可在这里恢复。</p></div>`}</div>`}

function artwork(n){const autumn=n.name.includes('秋');const a=autumn?'#e0b387':'#95bcc9',b=autumn?'#e9d9b1':'#e8cba2',c=autumn?'#c18f6a':'#568993';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="${c}"/><stop offset="1" stop-color="#284957"/></linearGradient></defs><rect width="960" height="650" fill="url(#sky)"/><circle cx="730" cy="150" r="72" fill="#fff4d3" opacity=".85"/><path d="M0 385 160 275 295 360 420 245 580 355 770 275 960 350V650H0Z" fill="${c}" opacity=".55"/><path d="M0 430 220 360 370 415 570 335 750 420 960 365V650H0Z" fill="#3d6473" opacity=".64"/><path d="M0 450 Q420 410 960 455V650H0Z" fill="url(#water)"/><path d="M0 505 Q470 465 960 505M0 550 Q470 510 960 555" stroke="#ffffff44" stroke-width="3" fill="none"/><path d="M185 475 Q200 395 195 320M195 365l-48-35m48 22 39-41" stroke="#233d3c" stroke-width="13" fill="none"/><circle cx="198" cy="308" r="55" fill="#2b5551" opacity=".68"/><circle cx="155" cy="332" r="37" fill="#3e6857" opacity=".9"/><circle cx="233" cy="321" r="39" fill="#407063" opacity=".85"/><text x="850" y="610" text-anchor="end" font-size="16" fill="#ffffffaa" font-family="Arial">CLOUDLANE · DEMO</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function previewContent(n){const type=n.category;if(type==='image')return `<img class="preview-image" id="preview-image" src="${artwork(n)}" style="transform:scale(${state.previewScale}) rotate(${state.previewRotate}deg) scaleX(${state.previewFlip})" alt="${esc(n.name)}"/>`;if(type==='video'||type==='audio')return `<div class="preview-media" style="${type==='audio'?'max-width:600px;aspect-ratio:4/2.5':''}"><div class="media-circle"></div><div class="media-title">${esc(n.name)} <span style="opacity:.55;font-size:11px">· 模拟播放面板</span></div><button class="media-play" data-act="videoToggle">${I(state.videoPlaying?'pause':'play','xl')}</button><div class="media-controls"><div class="progress" data-act="videoSeek"><i style="width:${state.videoTime}%"></i></div><div class="ctrl-row"><button class="iconbtn" data-act="videoToggle">${I(state.videoPlaying?'pause':'play')}</button><span>${Math.floor(state.videoTime*1.2).toString().padStart(2,'0')}:00 / 02:00</span><div class="spacer"></div><span>倍速</span><select id="speed-select" style="background:#ffffff18;color:white;border:1px solid #ffffff42;border-radius:5px;padding:4px"><option value="0.5" ${state.videoSpeed===.5?'selected':''} style="color:#222">0.5×</option><option value="1" ${state.videoSpeed===1?'selected':''} style="color:#222">1×</option><option value="1.5" ${state.videoSpeed===1.5?'selected':''} style="color:#222">1.5×</option><option value="2" ${state.videoSpeed===2?'selected':''} style="color:#222">2×</option></select>${I('maximize','sm')}</div></div></div>`;if(type==='pdf'||type==='document')return `<article class="page-paper"><div style="font-size:11px;color:#8295ae;margin-bottom:26px">${type==='pdf'?'PDF 文件预览':'Word · 转换为 PDF 的预览示意'}</div><h1>${esc(n.name.replace(/\.[^.]+$/,''))}</h1><p>本页为排版交互演示。正式系统将由 PDF.js 阅读原始 PDF，Word 则通过服务端文档转换生成高保真的分页预览资源。</p><h2>一、项目背景</h2><p>${esc(n.content||'系统采用模块化架构管理文件空间、目录树、共享权限与存储。通过专业预览器读取文档内容。')}</p><div class="line"></div><div class="line"></div><div class="line short"></div><h2>二、功能与技术结构</h2><p>支持空间隔离、共享目录、文件版本控制与全文搜索，同时保留完善的权限验证和后台管理能力。</p><div class="line"></div><div class="line short"></div><p style="text-align:center;color:#a7b1be;margin-top:50px">— 1 —</p></article>`;if(type==='ppt')return `<div class="ppt-slide"><span class="pill-tag">${state.slide+1} / 3</span><div class="ppt-line"></div><h2>${['产品概览','技术架构','协作与共享'][state.slide%3]}</h2><p>Cloudlane · 云端文件管理系统</p><div class="ppt-line"></div><p style="font-size:12px">使用左右方向键或底部按钮切换幻灯片</p></div>`;if(type==='sheet')return `<div class="preview-excel"><div style="display:flex;gap:5px;margin-bottom:12px"><span class="pill-tag tag-green">Sheet1 · 项目规划</span><span class="pill-tag">Sheet2 · 资源清单</span></div><table><thead><tr>${['','A','B','C','D','E'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${[['1','迭代','负责人','状态','优先级','完成度'],['2','基础文件系统','张工','进行中','P0','65%'],['3','Office 预览','李工','待开始','P1','0%'],['4','共享空间','王工','计划中','P1','10%'],['5','文件全文检索','张工','待开始','P1','0%'],['6','多存储适配','李工','计划中','P1','20%']].map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;if(type==='text'||type==='code')return `<div class="preview-code"><div style="color:#7f9ab8;margin-bottom:15px">${esc(n.name)} · 源文本预览</div><code>${esc(n.content||'# Cloudlane 文档\n\n## 简介\n这是 Markdown / TXT 在线预览交互示例。\n\n- 文件树\n- 文件共享\n- 全文搜索')}</code></div>`;if(type==='archive')return `<div class="archive-preview"><div style="font-weight:700;margin-bottom:20px">${I('archive')} 压缩包内容结构 · ${esc(n.name)}</div>${[['folder','assets','文件夹'],['folder','src','文件夹'],['file','README.md','3.2 KB'],['file','package.json','1.8 KB'],['file','design.png','2.4 MB']].map(([type,name,size])=>`<div class="archive-row">${I(type==='folder'?'folder':'file')}<b>${name}</b><small>${size}</small></div>`).join('')}<p style="font-size:11px;color:#97a4b3;margin:20px 0 0">示例内容，不会实际解压本地文件。</p></div>`;return `<div class="empty"><h2>${I('file','xl')} 暂不支持此文件类型的在线预览</h2><p>正式系统会展示文件详情并提供下载入口。</p></div>`}
function renderPreview(){if(!state.previewId)return '';const n=node(state.previewId);if(!n)return '';return `<div class="preview-mask"><div class="preview-top"><div class="preview-title">${I(catIcons[n.category]||'file')}${esc(n.name)}<span class="pill-tag" style="border-color:#ffffff30;background:#ffffff13;color:#d6e1f4">${catLabels[n.category]}</span></div><div class="row"><button class="btn small" data-act="versions" data-id="${n.id}">${I('clock','sm')}历史版本</button><button class="btn small" data-act="demoDownload">${I('download','sm')}下载</button><button class="iconbtn" data-act="closePreview" title="关闭">${I('x','lg')}</button></div></div><div class="preview-body">${previewContent(n)}</div><div class="preview-bottom">${n.category==='image'?`<button class="iconbtn" data-act="zoomOut" title="缩小">${I('zoom-out')}</button><span style="font-size:12px;color:#adb9c7">${Math.round(state.previewScale*100)}%</span><button class="iconbtn" data-act="zoomIn" title="放大">${I('zoom-in')}</button><button class="iconbtn" data-act="rotate" title="旋转">${I('rotate')}</button><button class="iconbtn" data-act="flip" title="水平翻转">${I('refresh')}</button><button class="iconbtn" data-act="resetImage" title="重置">${I('maximize')}</button>`:''}${n.category==='ppt'?`<button class="btn small" data-act="prevSlide">上一页</button><span>${state.slide+1} / 3</span><button class="btn small" data-act="nextSlide">下一页</button>`:''}<span style="color:#8f9eb2;font-size:11px">${n.category==='video'||n.category==='audio'?'演示控件，不播放真实媒体':n.category==='image'?'图片变换仅影响预览':'交互与阅读布局示意'}</span></div></div>`}
function renderPopup(){const root=document.getElementById('popup-root');let html='';if(state.popover){const p=state.popover;const maxx=window.innerWidth-207,maxy=window.innerHeight-305;html+=`<div class="popover" style="left:${Math.min(maxx,Math.max(8,p.x))}px;top:${Math.min(maxy,Math.max(8,p.y))}px">${p.type==='account'?`<button class="pop-item" data-act="navSettings">${I('settings','sm')}个人设置</button><button class="pop-item" data-act="enterAdmin">${I('shield','sm')}进入管理后台</button><div class="pop-divider"></div><button class="pop-item" data-act="resetDemo">${I('refresh','sm')}重置演示数据</button>`:popItems(node(p.id))}</div>`}if(state.noticeOpen)html+=`<div class="floating-pane"><div class="floating-title"><span>消息通知</span><button class="btn small ghost" data-act="readAll">全部已读</button></div>${data.messages.map(m=>`<div class="message-item ${!m.read?'unread':''}" data-act="readNotice" data-id="${m.id}"><div>${I('bell')}</div><div><b>${esc(m.title)} ${!m.read?'<span class="status-dot"></span>':''}</b><p>${esc(m.body)}</p><time>${esc(m.date)}</time></div></div>`).join('')}</div>`;
if(state.modal?.type==='search'){html+=`<div class="mask" data-backdrop="1" style="align-items:flex-start;padding-top:min(18vh,150px)"><div class="modal wide" role="dialog"><div class="row" style="border-bottom:1px solid var(--border);padding-bottom:15px">${I('search','lg')}<input id="search-box" style="width:100%;border:0;font-size:17px;color:#28374c" placeholder="搜索文件名、扩展名、文件夹或内容..." value="${esc(state.searchText)}" autofocus/><span class="kbd">Enter</span><button class="iconbtn" data-act="closeModal">${I('x')}</button></div><div style="margin-top:15px;color:#9aa5b2;font-size:12px">试试：需求、架构、组件、pdf、文件</div><div id="search-suggestions" style="margin-top:12px">${searchSuggestions()}</div></div></div>`}else if(state.modal)html+=getModal();if(state.previewId)html+=renderPreview();root.innerHTML=html;const focus=root.querySelector('[autofocus]');if(focus)setTimeout(()=>{try{focus.focus();focus.select?.()}catch(e){}},0)}
function searchSuggestions(){const a=searchData(state.searchText).slice(0,5);if(!state.searchText)return `<div class="notice">${I('info')}支持文件名、文件夹、后缀和已提取的正文片段。按 Enter 展示分类搜索结果。</div>`;return a.length?a.map(n=>`<button class="pop-item" style="padding:12px" data-act="searchOpenNode" data-id="${n.id}">${I(catIcons[n.category]||'file')}<span style="flex:1;text-align:left">${mark(n.name,state.searchText)}</span><span class="small-label">${n.content?.toLowerCase().includes(state.searchText.toLowerCase())?'正文匹配':'名称匹配'}</span></button>`).join(''):`<div style="padding:15px;color:#9ba5b2">未找到匹配文件，按 Enter 可查看搜索页面。</div>`}

function openNode(nid){const n=node(nid);if(!n||n.deleted)return;if(n.kind==='folder'){navSpace(n.space,n.id,state.sharedRoot&&pathTo(n).some(x=>x.id===state.sharedRoot)?state.sharedRoot:null);return}if(space(n.space)?.kind==='private'&&!state.privateUnlocked){state.modal={type:'unlock',sid:n.space,folder:n.parent,preview:n.id};renderPopup();return}n.lastOpened=Date.now();save();state.modal=null;state.previewId=n.id;state.previewScale=1;state.previewRotate=0;state.previewFlip=1;state.videoPlaying=false;state.videoTime=28;state.slide=0;renderPopup()}

case 'restoreVersion':{const selected=n.versions.find(x=>String(x.num)===String(el.dataset.version));if(!selected)break;const num=Math.max(...n.versions.map(x=>x.num))+1;n.versions.push({...selected,num,date:formattedDate()});n.versions=n.versions.slice(-Math.min(data.settings.maxVersions,data.admin.maxVersions));save();state.modal={type:'versions',id:n.id};renderPopup();toast('已恢复为新版本 V'+num);break}
case 'confirmBatchRename':{const prefix=document.getElementById('modal-prefix')?.value||'';if(!prefix){toast('请输入前缀');break}takeUndo();[...state.selected].forEach(x=>{const file=node(x);if(file&&!file.deleted){file.name=prefix+file.name;file.modified=formattedDate()}});state.selected.clear();save();state.modal=null;render();toast('批量重命名已完成',true);break}
case 'confirmMove':moveResource(n,document.getElementById('modal-target')?.value==='root'?null:document.getElementById('modal-target')?.value);break;
case 'confirmUnlock':{const pwd=document.getElementById('private-password')?.value;if(pwd!=='123456'){toast('演示密码错误，请输入 123456');break}state.privateUnlocked=true;const dest=state.modal;state.modal=null;navSpace(dest.sid,dest.folder||null,dest.root||null);if(dest.preview)openNode(dest.preview);toast('私密空间已解锁（演示）');break}
case 'confirmLinkCreate':{const file=node(document.getElementById('link-file')?.value);if(!file)break;data.links.unshift({id:id(),name:file.name,nodeId:file.id,pass:document.getElementById('link-pass')?.value.trim()||'',expire:document.getElementById('link-expire')?.value,visits:0,enabled:true});save();state.modal=null;state.searchMode='links';gotoView('share');toast('分享链接已生成');break}
case 'confirmMessage':{const title=document.getElementById('msg-title')?.value.trim(),body=document.getElementById('msg-body')?.value.trim();if(!title||!body){toast('请填写标题和内容');break}data.messages.unshift({id:id(),title,body,date:'刚刚',read:false});save();state.modal=null;render();toast('系统消息已发布（演示）');break}
case 'batchRename':if(!state.selected.size){toast('请先选择文件');break}state.modal={type:'batchRename'};renderPopup();break;
case 'batchMove':if(state.selected.size===1){state.modal={type:'move',id:[...state.selected][0]};renderPopup()}else toast('演示版仅支持单个文件移动，完整批量任务将在正式开发实现');break;
case 'batchDelete':if(!state.selected.size)break;takeUndo();[...state.selected].forEach(x=>node(x).deleted=true);state.selected.clear();save();render();toast('已批量移至回收站',true);break;
case 'clearSelection':state.selected.clear();render();break;
case 'restore':n.deleted=false;save();render();toast('文件已恢复');break;
case 'undo':if(undoState){data=JSON.parse(undoState);undoState=null;clearInterval(toastTimer);save();render();toast('已撤销上一操作')}break;
case 'zoomIn':state.previewScale=Math.min(3,state.previewScale+.2);renderPopup();break;
case 'zoomOut':state.previewScale=Math.max(.4,state.previewScale-.2);renderPopup();break;
case 'rotate':state.previewRotate=(state.previewRotate+90)%360;renderPopup();break;
case 'flip':state.previewFlip*=-1;renderPopup();break;
case 'resetImage':state.previewScale=1;state.previewRotate=0;state.previewFlip=1;renderPopup();break;
case 'closePreview':state.previewId=null;state.videoPlaying=false;renderPopup();break;
case 'videoToggle':state.videoPlaying=!state.videoPlaying;renderPopup();break;
case 'videoSeek':state.videoTime=Math.min(99,Math.round((e.clientX-el.getBoundingClientRect().left)/el.offsetWidth*100));renderPopup();break;
case 'nextSlide':state.slide=(state.slide+1)%3;renderPopup();break;
case 'prevSlide':state.slide=(state.slide+2)%3;renderPopup();break;
case 'demoDownload':toast('这是交互原型，没有实际文件下载服务');break;
case 'demoOnly':toast('此处展示交互入口，正式版本接入后端服务');break;
case 'enterAdmin':state.modal=null;state.popover=null;state.view='admin';state.adminPage='dashboard';render();break;
case 'exitAdmin':state.view='files';state.space='s2';state.folder=null;state.activeSide='space:s2';render();break;
case 'adminNav':state.adminPage=val;render();break;
case 'adminStorage':data.admin.storage=val;save();render();toast('已切换默认存储方案（仅模拟配置）');break;
case 'adminToggleRegister':data.admin.allowRegister=!data.admin.allowRegister;save();render();break;
case 'adminToggleShare':data.admin.allowShare=!data.admin.allowShare;save();render();break;
case 'saveSystemLimit':{let limit=Number(document.getElementById('system-limit')?.value);if(!Number.isInteger(limit)||limit<1||limit>100){toast('请输入 1—100 的整数');break}data.admin.maxVersions=limit;data.settings.maxVersions=Math.min(limit,data.settings.maxVersions);save();render();toast('系统上限已保存');break}
case 'addStorage':state.modal={type:'addStorage'};renderPopup();break;
case 'sendMessage':state.modal={type:'sendMessage'};renderPopup();break;
case 'resetDemo':{if(!confirm('确定将全部演示数据恢复为初始状态吗？'))break;data=seed();save();state={...state,view:'files',space:'s2',folder:null,sharedRoot:null,activeSide:'space:s2',selected:new Set(),category:'all',searchMode:'all',modal:null,popover:null,noticeOpen:false,previewId:null,privateUnlocked:false};render();toast('演示数据已重置');break}
default:break;
}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-act]');if(target){e.preventDefault();e.stopPropagation();mainAction(target.dataset.act,target,e);return}if(e.target.dataset.backdrop){state.modal=null;renderPopup();return}if(state.popover){state.popover=null;renderPopup()}if(state.noticeOpen&&!e.target.closest('.floating-pane')){state.noticeOpen=false;renderPopup()}});
document.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-rowid],[data-dragid],[data-cardid]');if(row){e.preventDefault();const n=node(row.dataset.rowid||row.dataset.dragid||row.dataset.cardid);if(n)openContext(n,e.clientX,e.clientY)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-select]')){const x=e.target.dataset.select;e.target.checked?state.selected.add(x):state.selected.delete(x);render();return}if(e.target.id==='select-all'){const all=getVisibleChildren();if(e.target.checked)all.forEach(x=>state.selected.add(x.id));else all.forEach(x=>state.selected.delete(x.id));render();return}if(e.target.id==='sort-select'){state.sort=e.target.value;render();return}if(e.target.id==='default-layout'){data.settings.view=e.target.value;state.layout=e.target.value;save();render();return}if(e.target.id==='version-limit'){data.settings.maxVersions=Number(e.target.value);save();document.getElementById('limit-label').textContent=e.target.value;toast('版本保留数量已更新');return}if(e.target.id==='speed-select'){state.videoSpeed=Number(e.target.value);renderPopup();return}});
document.addEventListener('input',e=>{if(e.target.id==='search-box'){state.searchText=e.target.value;const el=document.getElementById('search-suggestions');if(el)el.innerHTML=searchSuggestions()}if(e.target.id==='modal-prefix'){const box=document.getElementById('rename-preview');if(box)box.innerHTML=[...state.selected].map(x=>`<div class="setting-row" style="padding:10px 0"><span>${esc(node(x)?.name)}</span>${I('arrow-right','sm')}<b>${esc(e.target.value+node(x)?.name)}</b></div>`).join('')}});
document.addEventListener('keydown',e=>{const tag=document.activeElement?.tagName,typing=['INPUT','TEXTAREA','SELECT'].includes(tag);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.modal={type:'search'};renderPopup();return}if(e.key==='Escape'){if(state.previewId)state.previewId=null;else if(state.modal)state.modal=null;else if(state.popover)state.popover=null;else if(state.noticeOpen)state.noticeOpen=false;else state.selected.clear();render();return}if(e.key==='Enter'&&state.modal?.type==='search'){state.modal=null;state.view='search';state.searchMode='all';render();return}if(e.key==='Enter'&&state.modal?.type==='newFolder'){mainAction('confirmNewFolder',{},e);return}if(typing)return;if(state.previewId){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const n=node(state.previewId);if(n.category==='ppt'){state.slide=(state.slide+(e.key==='ArrowRight'?1:2))%3;renderPopup()}else{const files=children(n.parent,n.space).filter(x=>x.kind==='file'&&x.category===n.category);const ix=files.findIndex(x=>x.id===n.id);if(ix>=0&&files.length>1)openNode(files[(ix+(e.key==='ArrowRight'?1:-1)+files.length)%files.length].id)}e.preventDefault()}return}if(state.view!=='files')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();getVisibleChildren().forEach(n=>state.selected.add(n.id));render()}if(e.key==='Delete'&&state.selected.size){e.preventDefault();mainAction('batchDelete',{},e)}if(e.key==='F2'&&state.selected.size===1){e.preventDefault();const nid=[...state.selected][0];state.modal={type:'rename',id:nid};renderPopup()}});
let dragId=null;document.addEventListener('dragstart',e=>{const target=e.target.closest('[data-dragid]');if(target){dragId=target.dataset.dragid;e.dataTransfer?.setData('text/plain','cloudlane:'+dragId);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const n=e.target.closest('.tree-node');if(n){e.preventDefault();n.classList.add('dragover')}else if(e.target.closest('.main')&&e.dataTransfer?.types?.includes('Files'))e.preventDefault()});document.addEventListener('dragleave',e=>{const n=e.target.closest('.tree-node');if(n)n.classList.remove('dragover')});document.addEventListener('drop',e=>{const target=e.target.closest('.tree-node');document.querySelectorAll('.tree-node.dragover').forEach(x=>x.classList.remove('dragover'));if(target&&dragId){e.preventDefault();const source=node(dragId),dest=node(target.dataset.id);dragId=null;if(source&&dest&&source.id!==dest.id&&source.space===dest.space&&dest.kind==='folder')moveResource(source,dest.id);else toast('不能移动到该目标');return}if(e.target.closest('.main')&&e.dataTransfer?.files?.length){e.preventDefault();receiveFiles(e.dataTransfer.files)}});
function receiveFiles(files){if(state.view!=='files'){toast('请先进入一个空间，再上传文件');return}let amount=0;for(const f of files){const name=f.name;if(children(state.folder).some(n=>n.name===name)){toast('跳过同名文件：'+name);continue}data.nodes.push({id:id(),space:state.space,parent:state.folder,name,kind:'file',category:detect(name),size:f.size||0,modified:formattedDate(),favorite:false,hidden:false,deleted:false,versions:[{num:1,date:formattedDate(),size:f.size||0}],content:'这是本地演示上传文件，仅保存元数据，没有真实文件内容。'});amount++}save();render();toast(`演示上传完成 ${amount} 个文件（仅保存名称等元数据）`)}
document.getElementById('local-file-picker').addEventListener('change',e=>{receiveFiles(e.target.files);e.target.value=''});
videoTimer=setInterval(()=>{if(state.previewId&&state.videoPlaying){state.videoTime+=.2*state.videoSpeed;if(state.videoTime>=100){state.videoTime=0;state.videoPlaying=false}const bar=document.querySelector('.media-controls .progress>i');if(bar)bar.style.width=state.videoTime+'%'}},250);
state.layout=data.settings.view;render();
</script>
</body></html>
