server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    # 允许大文件分片及整文件上传，由后端策略统一校验大小上限
    client_max_body_size 0;
    client_body_timeout 300s;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSE 实时通知通道（消息与共享事件）：长连接、禁用缓冲与分块延迟
    location ~ ^/api/v1/.*/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # 常规 API、大文件上传与媒体 Range 断点下载
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /admin { return 308 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css|woff2?)$ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
}
